name: Run OWASP Maven Dependency Check
on:
  workflow_call:
    inputs:
      runner-os:
        description: 'The OS to run the check on.'
        default: 'ubuntu-latest'
        required: false
        type: string
      java-distribution:
        description: 'The java distribution to run the check with.'
        default: 'temurin'
        required: false
        type: string
      java-version:
        description: 'The java version to run the check with.'
        default: 21
        required: false
        type: number
      pom-path:
        description: 'Path to pom.xml or directory with pom.xml'
        default: 'pom.xml'
        required: false
        type: string
      suppression-path:
        description: 'Path to suppression.xml'
        default: 'suppression.xml'
        required: false
        type: string
    secrets:
      nvd-api-key:
        description: 'The NVD API Key used to fetch the NVD database.'
        required: true
      ossindex-username:
        description: 'The OSS Index username to access the OSS Index database'
        required: false
      ossindex-token:
        description: 'The OSS Index API token to access the OSS Index database'
        required: false
      slack-webhook-url:
        description: 'The Slack webhook used for publishing the results.'
        required: true

defaults:
  run:
    shell: bash

env:
  DEPENDENCY_CHECK_VERSION: 12.2.0

jobs:
  check-dependencies:
    name: Check dependencies
    runs-on: ${{ inputs.runner-os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          show-progress: false
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: 'maven'
      - name: Cache NVD DB
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data/
          key: dependency-check-${{ github.run_id }}
          restore-keys: |
            dependency-check
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
      - name: Override maven user settings
        run: |
          cat > maven-settings.xml << EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
              <localRepository/>
              <interactiveMode/>
              <offline/>
              <pluginGroups/>
              <servers>
                  <server>
                      <id>oss-index</id>
                      <username>\${env.OSSINDEX_USERNAME}</username>
                      <password>\${env.OSSINDEX_PASSWORD}</password>
                      <configuration></configuration>
                  </server>
              </servers>
              <mirrors/>
              <proxies/>
              <profiles/>
              <activeProfiles/>
          </settings>
          EOF
      - name: Check if default suppression file exists
        id: config-suppression
        run: |
          SUPPRESS_OPTION=""
          # check existence of default suppression file
          if [[ "${SUPPRESSION_FILE}" == "suppression.xml" && -f "${SUPPRESSION_FILE}" ]]; then
            SUPPRESS_OPTION="-DsuppressionFile=${SUPPRESSION_FILE}"
          fi
          echo "cli-parameter=${SUPPRESS_OPTION}" >> $GITHUB_OUTPUT
        env:
          SUPPRESSION_FILE: ${{ inputs.suppression-path }}
      - name: Run org.owasp:dependency-check plugin
        id: dependency-check
        continue-on-error: true
        run: >
          mvn org.owasp:dependency-check-maven:${{env.DEPENDENCY_CHECK_VERSION}}:check
          --settings maven-settings.xml
          --file ${POM_FILE}
          -DnvdValidForHours=24
          -DfailBuildOnCVSS=0
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DossIndexServerId=oss-index
          ${SUPPRESSION_OPTION}
        env:
          POM_FILE: ${{ inputs.pom-path }}
          NVD_API_KEY: ${{ secrets.nvd-api-key }}
          SUPPRESSION_OPTION: ${{ steps.config-suppression.outputs.cli-parameter }}
          OSSINDEX_USERNAME: ${{ secrets.ossindex-username }}
          OSSINDEX_PASSWORD: ${{ secrets.ossindex-token }}
      - name: Upload report on failure
        if: steps.dependency-check.outcome == 'failure'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: error
      - name: Slack Notification on regular check
        if: github.event_name == 'schedule' && steps.dependency-check.outcome == 'failure'
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.slack-webhook-url }}
          SLACK_USERNAME: 'Cryptobot'
          SLACK_ICON: false
          SLACK_ICON_EMOJI: ':bot:'
          SLACK_CHANNEL: 'cryptomator-desktop'
          SLACK_TITLE: "Vulnerabilities in ${{ github.event.repository.name }} detected."
          SLACK_MESSAGE: "Download the <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|report> for more details."
          SLACK_FOOTER: false
          MSG_MINIMAL: true
      - name: Failing workflow on release branch
        if: github.event_name == 'push' && steps.dependency-check.outcome == 'failure'
        shell: bash
        run: exit 1
