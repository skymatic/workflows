name: Update Dependency-Check Version
on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the first day of every month
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  WORKFLOW_FILE: .github/workflows/run-dependency-check.yml
  METADATA_URL: https://repo1.maven.org/maven2/org/owasp/dependency-check-maven/maven-metadata.xml

jobs:
  update-dependency-check:
    name: Update dependency-check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          show-progress: false
          # PAT is required because the default GITHUB_TOKEN may not modify files under .github/workflows/.
          token: ${{ secrets.WORKFLOW_UPDATE_TOKEN }}
      - name: Determine current and latest version
        id: versions
        run: |
          current=$(grep -oP 'DEPENDENCY_CHECK_VERSION:\s*\K\S+' "${WORKFLOW_FILE}")
          latest=$(curl -fsSL "${METADATA_URL}" | grep -oP '<release>\K[^<]+')
          if [[ -z "${latest}" ]]; then
            echo "::error::Could not determine the latest dependency-check version from ${METADATA_URL}." >&2
            exit 1
          fi
          echo "current=${current}" >> "${GITHUB_OUTPUT}"
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"
          if [[ "${current}" == "${latest}" ]]; then
            echo "Already on the latest version (${current})."
            echo "outdated=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Update available: ${current} -> ${latest}"
            echo "outdated=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Open pull request
        if: steps.versions.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_UPDATE_TOKEN }}
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          branch="chore/update-dependency-check-${LATEST}"

          # Don't recreate the pull request if a previous run already opened one.
          if [[ -n "$(gh pr list --head "${branch}" --state open --json number --jq '.[].number')" ]]; then
            echo "A pull request for ${LATEST} already exists. Nothing to do."
            exit 0
          fi

          sed -i "s/^\(\s*DEPENDENCY_CHECK_VERSION:\s*\).*/\1${LATEST}/" "${WORKFLOW_FILE}"

          git config user.name 'cryptobot'
          git config user.email 'cryptobot@users.noreply.github.com'
          git switch -c "${branch}"
          git add "${WORKFLOW_FILE}"
          git commit -m "Update dependency check to version ${LATEST}"
          git push --force-with-lease -u origin "${branch}"

          cat > pr-body.md << EOF
          Bumps \`DEPENDENCY_CHECK_VERSION\` in \`${WORKFLOW_FILE}\` from \`${CURRENT}\` to \`${LATEST}\`.

          _PR created by workflow ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))._
          EOF

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${branch}" \
            --title "Update dependency check to version ${LATEST}" \
            --body-file pr-body.md
